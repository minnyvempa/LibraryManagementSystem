<!DOCTYPE html>
<html>
<head>
    <title>Login - Library Management System</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1e3a5f;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #142940;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #1e3a5f;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1e3a5f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        .register a {
            color: #1e3a5f;
            text-decoration: none;
        }

        footer {
            background: #142940;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Library Management System</h1>
    <p>Login</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="books.html">Books</a>
    <a href="members.html">Members</a>
    <a href="issue-book.html">Issue Book</a>
    <a href="return-book.html">Return Book</a>
    <a href="login.html">Login</a>
</nav>

<div class="login-box">

    <h2>Member Login</h2>
    <p id="login-message" role="status"></p>

    <form action="login" method="post">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        <p>Don't have an account?</p>
        <a href="register.html">Register Here</a>
    </div>

</div>

<footer>
    <p>© 2026 Library Management System</p>
</footer>

<script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("login-message");
        if (params.get("error") === "invalid") message.textContent = "Invalid email or password.";
        if (params.get("registered") === "success") message.textContent = "Registration successful. Please log in.";
    </script>
</body>
</html>
