<!DOCTYPE html>
<html>
<head>
    <title>Register - Library Management System</title>
</head>
<body>

    <h2>Member Registration</h2>
    <p id="message" aria-live="polite"></p>

    <form action="register" method="post">

        <label>Name</label>
        <input type="text" name="name" placeholder="Enter your name" minlength="2" required>
        <br><br>

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter your password" minlength="8" required>
        <br><br>

        <button type="submit">Register</button>

    </form>

    <p>Already have an account?</p>
    <a href="login.html">Login Here</a>

<script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("message");
        if (params.get("error") === "invalid") message.textContent = "Please enter valid details. Password must be at least 8 characters.";
        if (params.get("error") === "exists") message.textContent = "This email is already registered.";
    </script>
</body>
</html>
